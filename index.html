<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqua 엑셀 데이터 검색</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <div class="background-animation">
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
        <div class="bubble bubble-4"></div>
        <div class="bubble bubble-5"></div>
    </div>

    <!-- Login Screen -->
    <div id="loginScreen" class="login-overlay">
        <div class="login-box glass-panel">
            <h2 class="highlight">Aqua Login</h2>
            <div id="loginClock" class="login-clock"></div>
            <div class="login-form">
                <div class="form-group">
                    <label>아이디</label>
                    <input type="text" id="loginId" placeholder="ID를 입력하세요" autocomplete="username">
                </div>
                <div class="form-group">
                    <label>비밀번호</label>
                    <input type="password" id="loginPw" placeholder="비밀번호를 입력하세요" autocomplete="current-password">
                </div>
                <button id="loginBtn" class="primary-btn login-submit">로그인</button>
                <p id="loginMsg" class="error-msg hidden"></p>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <main class="container">
                <h1><span class="highlight">Aqua</span> Search</h1>
                <p>pasco.xlsx 통합 데이터 검색 시스템</p>
            </header>

        <section class="search-section glass-panel">
            <div class="user-info-banner">
                <div class="user-info-content">
                    <span class="user-name-tag"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> <span id="displayUserId">-</span></span>
                    <span class="user-perm-tag"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg> <span id="displayUserPerm">-</span></span>
                    <span class="user-time-tag"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> <span id="displayCurrentTime">-</span></span>
                    <span class="user-end-tag"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> 종료일: <span id="displayUserEnd">-</span></span>
                    <button id="userSettingsBtn" class="user-settings-btn hidden">사용자설정</button>
                    <button id="logoutBtn" class="logout-btn">로그아웃</button>
                </div>
            </div>
            <div class="search-controls">
                <div class="select-wrapper">
                    <select id="sheetSelect" onchange="document.getElementById('searchInput').value='';">
                        <option value="전체">전체 (All Sheets)</option>
                        <!-- Options will be populated by JS -->
                    </select>
                </div>
                
                <div class="input-wrapper">
                    <div class="search-input-container">
                        <input type="text" id="searchInput" placeholder="검색어를 입력하세요 (품명, 코드, 모델 등)..." autocomplete="off">
                        <button type="button" id="clearSearchBtn" class="clear-btn" onclick="document.getElementById('searchInput').value=''; document.getElementById('searchInput').focus();">&times;</button>
                    </div>
                    <button id="searchBtn" class="primary-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        검색
                    </button>
                    <button id="addBtn" class="primary-btn secondary-style">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        추가
                    </button>
                    <button id="bulkDeleteBtn" class="primary-btn danger-style">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        삭제
                    </button>
                </div>
            </div>
        </section>

        <section class="results-section">
            <div class="results-header">
                <h2>검색 결과 <span id="resultCount" class="badge">0</span></h2>
                <div id="loadingIndicator" class="loader hidden"></div>
            </div>
            
            <div id="resultsContainer" class="results-grid">
                <!-- Result cards will be injected here -->
                <div class="empty-state">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="empty-icon">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <p>검색어를 입력하고 검색 버튼을 눌러주세요.</p>
                </div>
            </div>
        </section>
    </main>
</div>

    <!-- Image Modal for full size view -->
    <div id="imageModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <img id="modalImg" src="" alt="확대 이미지">
            <div id="modalThumbnails" class="modal-thumbnails"></div>
        </div>
    </div>

    <!-- Add Item Modal -->
    <div id="addModal" class="modal">
        <div class="modal-card glass-panel">
            <div class="modal-header">
                <h2>새 항목 추가</h2>
                <span class="close-add-modal" onclick="closeAddModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>품명</label>
                    <input type="text" id="add-품명" placeholder="품명을 입력하세요">
                </div>
                <div class="form-group">
                    <label>자재코드</label>
                    <input type="text" id="add-자재코드" placeholder="자재코드를 입력하세요">
                </div>
                <div class="form-group">
                    <label>사용모델</label>
                    <input type="text" id="add-사용모델" placeholder="사용모델을 입력하세요">
                </div>
                <div class="form-group">
                    <label>가격</label>
                    <input type="text" id="add-가격" placeholder="가격을 입력하세요">
                </div>
                <div class="form-group">
                    <label>메모</label>
                    <textarea id="add-memo" placeholder="메모를 입력하세요"></textarea>
                </div>
                <div class="status-selection">
                    <label>상태 선택 (기본: 판매가능)</label>
                    <div class="status-radios">
                        <label class="status-radio-opt"><input type="radio" name="add-status" value="판매가능" checked><span>✅</span></label>
                        <label class="status-radio-opt"><input type="radio" name="add-status" value="수리판매"><span>🛒</span></label>
                        <label class="status-radio-opt"><input type="radio" name="add-status" value="재고확인"><span>📦</span></label>
                        <label class="status-radio-opt"><input type="radio" name="add-status" value="미확인"><span>❓</span></label>
                        <label class="status-radio-opt"><input type="radio" name="add-status" value="수리전용"><span>🔧</span></label>
                        <label class="status-radio-opt"><input type="radio" name="add-status" value="단종"><span>🚫</span></label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="saveAddBtn" class="primary-btn" onclick="saveNewItem()">저장하기</button>
                <button id="cancelAddBtn" class="btn-cancel" onclick="closeAddModal()">취소</button>
            </div>
        </div>
    </div>

    <!-- User Settings Modal -->
    <div id="userSettingsModal" class="modal user-settings-modal">
        <div class="modal-card glass-panel wide-modal">
            <div class="modal-header">
                <h2>사용자 계정 설정</h2>
                <span class="close-user-modal" onclick="closeUserModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="table-responsive">
                    <table class="user-table">
                        <thead>
                            <tr>
                                <th>이름</th>
                                <th>비밀번호</th>
                                <th>구분</th>
                                <th>권한</th>
                                <th>시작일</th>
                                <th>종료일</th>
                                <th>예상사용일자</th>
                                <th>관리</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">
                            <!-- User rows will be injected here -->
                        </tbody>
                    </table>
                </div>
                <button class="add-user-row-btn" onclick="addNewUserRow()">+ 사용자 추가</button>
            </div>
            <div class="modal-footer">
                <button id="saveUsersBtn" class="primary-btn" onclick="saveUsers()">전체 저장</button>
                <button class="btn-cancel" onclick="closeUserModal()">닫기</button>
            </div>
        </div>
    </div>

    <script src="app.js?v=14"></script>
</body>
</html>
